<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>END JUNE — Music Video Engine</title>
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#dc2626" />
<style>
  :root { --bg:#09090b; --card:#141418; --border:#27272a; --red:#dc2626; --text:#f4f4f5; --muted:#a1a1aa; }
  * { box-sizing:border-box; font-family:system-ui,-apple-system,sans-serif; }
  body { margin:0; background:var(--bg); color:var(--text); padding:14px; }
  header { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); padding-bottom:10px; margin-bottom:14px; }
  h1 { margin:0; font-size:1.3rem; letter-spacing:2px; font-weight:900; }
  h1 span { color:var(--red); }
  .grid { display:grid; grid-template-columns:1fr; gap:14px; max-width:1100px; margin:auto; }
  @media(min-width:850px){ .grid { grid-template-columns:380px 1fr; } }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; }
  .label { font-size:0.75rem; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:6px; display:block; }
  button, select, input[type="file"] { width:100%; padding:10px; border-radius:8px; border:1px solid var(--border); background:#1f1f26; color:var(--text); font-weight:600; cursor:pointer; }
  button.primary { background:var(--red); border-color:var(--red); color:#fff; }
  button.primary:disabled { opacity:0.5; cursor:not-allowed; }
  .row { display:flex; gap:8px; margin-bottom:10px; }
  .row > * { flex:1; }
  .pill-group { display:flex; gap:6px; margin-bottom:10px; }
  .pill { padding:8px; text-align:center; border:1px solid var(--border); border-radius:8px; cursor:pointer; font-size:0.8rem; font-weight:700; }
  .pill.active { background:var(--red); border-color:var(--red); }
  canvas { width:100%; max-height:460px; background:#000; border-radius:10px; display:block; margin:auto; object-fit:contain; }
  .clip-list { max-height:220px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; margin-top:8px; }
  .clip-item { background:#1c1c22; padding:8px; border-radius:8px; border:1px solid var(--border); font-size:0.8rem; }
  .clip-item select { padding:5px; font-size:0.75rem; margin-top:4px; }
  .var-grid { display:grid; grid-template-columns:repeat(9, 1fr); gap:4px; margin:10px 0; }
  .var-btn { padding:8px 0; font-size:0.8rem; text-align:center; border-radius:6px; background:#1f1f26; border:1px solid var(--border); cursor:pointer; }
  .var-btn.active { background:var(--red); border-color:var(--red); font-weight:800; }
  #camModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:50; padding:16px; flex-direction:column; justify-content:center; align-items:center; }
  #camPreview { width:100%; max-width:420px; border-radius:12px; background:#000; }
  .status { font-size:0.8rem; color:#4ade80; margin-top:6px; min-height:18px; }
</style>
</head>
<body>

<header>
  <h1>END <span>JUNE</span></h1>
  <div style="font-size:0.75rem;color:var(--muted)">OFFLINE BEAT-SYNC STUDIO</div>
</header>

<div class="grid">
  <!-- LEFT CONTROLS -->
  <div class="card">
    <span class="label">1. Aspect Ratio</span>
    <div class="pill-group" id="aspectToggle">
      <div class="pill active" data-aspect="9:16">9:16 Vertical</div>
      <div class="pill" data-aspect="16:9">16:9 Widescreen</div>
    </div>

    <span class="label">2. Upload Track (MP3 / WAV)</span>
    <input type="file" id="audioInput" accept="audio/*" />
    <div class="status" id="beatStatus">Waiting for track...</div>

    <span class="label" style="margin-top:10px;">3. Add Footage (Performance & B-Roll)</span>
    <div class="row">
      <label style="flex:1;text-align:center;padding:9px;background:#1f1f26;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:0.8rem;font-weight:700;">
        + Upload Clips
        <input type="file" id="videoInput" accept="video/*" multiple hidden />
      </label>
      <button id="openCamBtn" style="font-size:0.8rem;">● Shoot Take</button>
    </div>

    <div class="clip-list" id="clipList"></div>

    <span class="label" style="margin-top:12px;">4. Shuffle Engine (Up to 9 Variations)</span>
    <button class="primary" id="shuffleBtn">⚡ SHUFFLE 9 VARIATIONS</button>
    <div class="var-grid" id="varGrid"></div>

    <span class="label" style="margin-top:10px;">5. Export & Smart Size Compressor</span>
    <div class="row">
      <select id="resSelect">
        <option value="720">720p HD (Fast)</option>
        <option value="1080">1080p Full HD</option>
      </select>
      <select id="compSelect">
        <option value="1800000">Compact (~13 MB/min)</option>
        <option value="3500000" selected>Balanced HQ (~26 MB/min)</option>
        <option value="6000000">Master (~45 MB/min)</option>
      </select>
    </div>
    <button class="primary" id="exportBtn">⬇ EXPORT COMPRESSED MP4</button>
    <div class="status" id="exportStatus"></div>
  </div>

  <!-- RIGHT PREVIEW -->
  <div class="card" style="display:flex;flex-direction:column;justify-content:space-between;">
    <canvas id="stage" width="720" height="1280"></canvas>
    <div class="row" style="margin-top:12px;margin-bottom:0;">
      <button id="playBtn">▶ Preview Sync</button>
      <button id="stopBtn">■ Stop</button>
    </div>
  </div>
</div>

<!-- CAMERA TAKE MODAL -->
<div id="camModal">
  <video id="camPreview" autoplay muted playsinline></video>
  <div class="row" style="max-width:420px;width:100%;margin-top:12px;">
    <button class="primary" id="recToggleBtn">● Start Synced Take</button>
    <button id="closeCamBtn">Close</button>
  </div>
</div>

<script type="module">
import { Output, Mp4OutputFormat, BufferTarget, CanvasSource, AudioBufferSource } from 'https://cdn.jsdelivr.net/npm/mediabunny@1.25.0/+esm';

if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});

// STATE
let aspect = '9:16';
let audioBuffer = null;
let audioCtx = null;
let audioSourceNode = null;
let beatTimes = [];
let clips = []; // { id, name, type:'perf'|'broll', grade, fx, videoEl, duration }
let variations = []; // Array of 9 timelines: [{ clipIndex, startOffset, time, fx }]
let activeVar = 0;
let isPlaying = false;
let playStartTime = 0;
let rafId = null;

const GRADES = [
  { id: 0, name: 'Color Isolation (RED Pop + B&W)' },
  { id: 1, name: 'Dark / Moody Cinematic' },
  { id: 2, name: 'High Contrast B&W' },
  { id: 3, name: 'Neon Vibrant' },
  { id: 4, name: 'Crimson RED Wash' },
  { id: 5, name: 'Clean Natural' }
];
const FX_LIST = ['Zoom Punch', 'Beat Flash', 'RGB Glitch', 'Beat Shake', 'Clean Cut'];

// WEBGL2 SHADER SETUP FOR REAL-TIME COLOR GRADING + FX
const canvas = document.getElementById('stage');
const gl = canvas.getContext('webgl2', { preserveDrawingBuffer: true });

const vs = `#version 300 es
in vec2 a_pos; out vec2 v_uv;
void main(){ v_uv = a_pos * 0.5 + 0.5; v_uv.y = 1.0 - v_uv.y; gl_Position = vec4(a_pos, 0.0, 1.0); }`;

const fs = `#version 300 es
precision mediump float;
in vec2 v_uv; out vec4 outColor;
uniform sampler2D u_tex;
uniform int u_grade;
uniform int u_fx;
uniform float u_beatPulse; // 1.0 on cut, decays to 0.0
uniform vec2 u_scale; // aspect cover crop

void main(){
  vec2 uv = (v_uv - 0.5) * u_scale + 0.5;
  // FX: Zoom Punch (0) or Shake (3)
  if(u_fx == 0) { uv = (uv - 0.5) * (1.0 - u_beatPulse * 0.08) + 0.5; }
  if(u_fx == 3) { uv.x += sin(u_beatPulse * 30.0) * 0.015 * u_beatPulse; }

  vec3 col;
  // FX: RGB Glitch (2)
  if(u_fx == 2 && u_beatPulse > 0.15) {
    float shift = 0.018 * u_beatPulse;
    col.r = texture(u_tex, uv + vec2(shift, 0.0)).r;
    col.g = texture(u_tex, uv).g;
    col.b = texture(u_tex, uv - vec2(shift, 0.0)).b;
  } else {
    col = texture(u_tex, clamp(uv, 0.001, 0.999)).rgb;
  }

  float lum = dot(col, vec3(0.299, 0.587, 0.114));

  // COLOR GRADING
  if(u_grade == 0) { // RED ISOLATION
    float redness = col.r - max(col.g, col.b);
    float mask = smoothstep(0.08, 0.25, redness);
    vec3 bw = vec3(pow(lum, 1.15));
    col = mix(bw, col * vec3(1.25, 0.9, 0.9), mask);
  } else if(u_grade == 1) { // DARK MOODY CINEMATIC
    col = pow(col, vec3(1.25)) * vec3(0.85, 0.92, 1.05);
    col = mix(vec3(lum), col, 0.85);
  } else if(u_grade == 2) { // HIGH CONTRAST B&W
    float c = clamp((lum - 0.5) * 1.65 + 0.5, 0.0, 1.0);
    col = vec3(c);
  } else if(u_grade == 3) { // NEON VIBRANT
    col = mix(vec3(lum), col, 1.55);
    col = pow(col, vec3(0.92)) * vec3(1.05, 0.95, 1.15);
  } else if(u_grade == 4) { // CRIMSON RED WASH
    col = vec3(lum * 1.35, lum * 0.22, lum * 0.22);
  }

  // FX: Beat Flash (1)
  if(u_fx == 1) { col += vec3(u_beatPulse * 0.55); }

  outColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

function createShader(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, createShader(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, createShader(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const posLoc = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(posLoc);
gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);

// ASPECT RATIO TOGGLE
document.querySelectorAll('#aspectToggle .pill').forEach(p => {
  p.onclick = () => {
    document.querySelectorAll('#aspectToggle .pill').forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    aspect = p.dataset.aspect;
    updateCanvasSize();
  };
});

function updateCanvasSize(){
  const h = parseInt(document.getElementById('resSelect').value);
  if(aspect === '9:16'){ canvas.width = Math.round(h * 9 / 16); canvas.height = h; }
  else { canvas.width = Math.round(h * 16 / 9); canvas.height = h; }
  gl.viewport(0, 0, canvas.width, canvas.height);
}
document.getElementById('resSelect').onchange = updateCanvasSize;

// AUDIO UPLOAD & BEAT DETECTION
document.getElementById('audioInput').onchange = async (e) => {
  const file = e.target.files[0];
  if(!file) return;
  document.getElementById('beatStatus').textContent = 'Analyzing beats...';
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const arr = await file.arrayBuffer();
  audioBuffer = await audioCtx.decodeAudioData(arr);
  beatTimes = detectBeats(audioBuffer);
  document.getElementById('beatStatus').textContent = `Ready: ${audioBuffer.duration.toFixed(1)}s | ${beatTimes.length} Sync Cuts Detected`;
  if(clips.length) generate9Variations();
};

function detectBeats(buffer){
  const data = buffer.getChannelData(0);
  const sr = buffer.sampleRate;
  const step = Math.floor(sr * 0.05); // 50ms windows
  const energies = [];
  for(let i = 0; i < data.length; i += step){
    let sum = 0;
    for(let j = 0; j < step && i + j < data.length; j++) sum += data[i+j] * data[i+j];
    energies.push(Math.sqrt(sum / step));
  }
  const cuts = [0];
  let lastCut = 0;
  for(let i = 2; i < energies.length - 2; i++){
    const t = (i * step) / sr;
    const localAvg = (energies[i-2] + energies[i-1] + energies[i+1] + energies[i+2]) / 4;
    // Cut on strong energy transient with minimum 0.45s spacing
    if(energies[i] > localAvg * 1.32 && energies[i] > 0.08 && (t - lastCut) >= 0.45){
      cuts.push(t);
      lastCut = t;
    }
  }
  return cuts;
}

// VIDEO UPLOAD & CLIP LIST
document.getElementById('videoInput').onchange = async (e) => {
  for(const file of e.target.files){
    await addVideoClip(file, file.name);
  }
  if(beatTimes.length) generate9Variations();
};

async function addVideoClip(blob, name){
  const url = URL.createObjectURL(blob);
  const v = document.createElement('video');
  v.src = url; v.muted = true; v.playsInline = true; v.preload = 'auto';
  await new Promise(r => v.onloadedmetadata = r);
  clips.push({ id: Date.now() + Math.random(), name, type: clips.length % 2 === 0 ? 'perf' : 'broll', grade: 0, fx: 0, videoEl: v, duration: v.duration || 4 });
  renderClipList();
}

function renderClipList(){
  const list = document.getElementById('clipList');
  list.innerHTML = '';
  clips.forEach((c, idx) => {
    const div = document.createElement('div');
    div.className = 'clip-item';
    div.innerHTML = `
      <div style="display:flex;justify-content:space-between;">
        <strong>${idx+1}. ${c.name.slice(0,18)}</strong>
        <span style="color:var(--red);cursor:pointer;" data-del="${idx}">✕</span>
      </div>
      <div class="row" style="margin:4px 0 0 0;">
        <select data-type="${idx}">
          <option value="perf" ${c.type==='perf'?'selected':''}>Performance</option>
          <option value="broll" ${c.type==='broll'?'selected':''}>B-Roll</option>
        </select>
        <select data-grade="${idx}">
          ${GRADES.map(g => `<option value="${g.id}" ${c.grade===g.id?'selected':''}>${g.name}</option>`).join('')}
        </select>
        <select data-fx="${idx}">
          ${FX_LIST.map((f, i) => `<option value="${i}" ${c.fx===i?'selected':''}>${f}</option>`).join('')}
        </select>
      </div>`;
    list.appendChild(div);
  });
  list.querySelectorAll('[data-del]').forEach(el => el.onclick = () => { clips.splice(el.dataset.del, 1); renderClipList(); });
  list.querySelectorAll('[data-type]').forEach(el => el.onchange = () => clips[el.dataset.type].type = el.value);
  list.querySelectorAll('[data-grade]').forEach(el => el.onchange = () => clips[el.dataset.grade].grade = parseInt(el.value));
  list.querySelectorAll('[data-fx]').forEach(el => el.onchange = () => clips[el.dataset.fx].fx = parseInt(el.value));
}

// SHUFFLE 9 VARIATIONS
function generate9Variations(){
  if(!clips.length) return alert('Add at least 1 video clip first.');
  const cuts = beatTimes.length ? beatTimes : Array.from({length: 30}, (_, i) => i * 0.8);
  const perf = clips.map((c, i) => ({c, i})).filter(x => x.c.type === 'perf');
  const broll = clips.map((c, i) => ({c, i})).filter(x => x.c.type === 'broll');

  variations = Array.from({length: 9}, (_, vIdx) => {
    let lastClip = -1;
    return cuts.map((t, cutIdx) => {
      // Alternate Performance & B-Roll smartly when both exist
      const usePerf = (perf.length && broll.length) ? (cutIdx % 2 === vIdx % 2) : perf.length > 0;
      const pool = usePerf ? perf : (broll.length ? broll : perf);
      let chosen = pool[Math.floor(Math.random() * pool.length)];
      if(pool.length > 1 && chosen.i === lastClip){
        chosen = pool[(pool.indexOf(chosen) + 1) % pool.length];
      }
      lastClip = chosen.i;
      const maxStart = Math.max(0, chosen.c.duration - 1.5);
      return { time: t, clipIndex: chosen.i, startOffset: Math.random() * maxStart };
    });
  });

  const grid = document.getElementById('varGrid');
  grid.innerHTML = '';
  for(let i = 0; i < 9; i++){
    const b = document.createElement('div');
    b.className = 'var-btn' + (i === activeVar ? ' active' : '');
    b.textContent = `V${i+1}`;
    b.onclick = () => {
      activeVar = i;
      document.querySelectorAll('.var-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      renderFrameAtTime(0);
    };
    grid.appendChild(b);
  }
  renderFrameAtTime(0);
}
document.getElementById('shuffleBtn').onclick = generate9Variations;

// RENDER SINGLE FRAME AT TIME T
async function renderFrameAtTime(t, seekExact = false){
  const tl = variations[activeVar];
  if(!tl || !tl.length || !clips.length) return;
  let segIdx = 0;
  for(let i = 0; i < tl.length; i++){ if(tl[i].time <= t) segIdx = i; else break; }
  const seg = tl[segIdx];
  const clip = clips[seg.clipIndex];
  const v = clip.videoEl;
  const targetTime = (seg.startOffset + (t - seg.time)) % Math.max(0.1, clip.duration - 0.05);

  if(seekExact){
    v.currentTime = targetTime;
    await new Promise(r => { const h = () => { v.removeEventListener('seeked', h); r(); }; v.addEventListener('seeked', h); setTimeout(r, 80); });
  } else if(Math.abs(v.currentTime - targetTime) > 0.35){
    v.currentTime = targetTime;
  }

  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, v);

  // Aspect cover calculation
  const cAsp = canvas.width / canvas.height;
  const vAsp = (v.videoWidth || 720) / (v.videoHeight || 1280);
  let sx = 1, sy = 1;
  if(vAsp > cAsp) sx = cAsp / vAsp; else sy = vAsp / cAsp;

  const pulse = Math.max(0, 1 - (t - seg.time) * 3.5);
  gl.uniform1i(gl.getUniformLocation(prog, 'u_grade'), clip.grade);
  gl.uniform1i(gl.getUniformLocation(prog, 'u_fx'), clip.fx);
  gl.uniform1f(gl.getUniformLocation(prog, 'u_beatPulse'), pulse);
  gl.uniform2f(gl.getUniformLocation(prog, 'u_scale'), sx, sy);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// PREVIEW PLAYBACK
document.getElementById('playBtn').onclick = () => {
  if(!variations.length) generate9Variations();
  if(!variations.length) return;
  stopPlayback();
  isPlaying = true;
  if(audioBuffer && audioCtx){
    audioSourceNode = audioCtx.createBufferSource();
    audioSourceNode.buffer = audioBuffer;
    audioSourceNode.connect(audioCtx.destination);
    audioSourceNode.start();
    playStartTime = audioCtx.currentTime;
  } else {
    playStartTime = performance.now() / 1000;
  }
  clips.forEach(c => c.videoEl.play().catch(()=>{}));
  const loop = () => {
    if(!isPlaying) return;
    const now = (audioBuffer && audioCtx) ? (audioCtx.currentTime - playStartTime) : (performance.now()/1000 - playStartTime);
    const maxDur = audioBuffer ? audioBuffer.duration : 20;
    if(now >= maxDur) return stopPlayback();
    renderFrameAtTime(now, false);
    rafId = requestAnimationFrame(loop);
  };
  loop();
};

function stopPlayback(){
  isPlaying = false;
  cancelAnimationFrame(rafId);
  if(audioSourceNode){ try{ audioSourceNode.stop(); }catch(e){} audioSourceNode = null; }
  clips.forEach(c => c.videoEl.pause());
}
document.getElementById('stopBtn').onclick = stopPlayback;

// IN-APP CAMERA TAKE RECORDER
let camStream = null, mediaRec = null, recChunks = [];
document.getElementById('openCamBtn').onclick = async () => {
  document.getElementById('camModal').style.display = 'flex';
  camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
  document.getElementById('camPreview').srcObject = camStream;
};
document.getElementById('closeCamBtn').onclick = () => {
  document.getElementById('camModal').style.display = 'none';
  if(camStream) camStream.getTracks().forEach(t => t.stop());
};
document.getElementById('recToggleBtn').onclick = () => {
  const btn = document.getElementById('recToggleBtn');
  if(!mediaRec || mediaRec.state === 'inactive'){
    recChunks = [];
    mediaRec = new MediaRecorder(camStream);
    mediaRec.ondataavailable = e => { if(e.data.size) recChunks.push(e.data); };
    mediaRec.onstop = async () => {
      stopPlayback();
      const blob = new Blob(recChunks, { type: 'video/webm' });
      await addVideoClip(blob, `Take_${clips.length+1}.webm`);
      if(beatTimes.length) generate9Variations();
      document.getElementById('closeCamBtn').click();
    };
    mediaRec.start();
    if(audioBuffer && audioCtx){
      audioSourceNode = audioCtx.createBufferSource();
      audioSourceNode.buffer = audioBuffer;
      audioSourceNode.connect(audioCtx.destination);
      audioSourceNode.start();
    }
    btn.textContent = '■ Stop & Add Take';
  } else {
    mediaRec.stop();
    btn.textContent = '● Start Synced Take';
  }
};

// HARDWARE-ACCELERATED COMPRESSED MP4 EXPORT
document.getElementById('exportBtn').onclick = async () => {
  if(!variations.length) return alert('Generate variations first.');
  stopPlayback();
  const status = document.getElementById('exportStatus');
  const bitrate = parseInt(document.getElementById('compSelect').value);
  const fps = 30;
  const duration = audioBuffer ? audioBuffer.duration : 15;
  const totalFrames = Math.floor(duration * fps);

  status.textContent = 'Encoding compressed MP4 on device GPU...';
  const output = new Output({ format: new Mp4OutputFormat(), target: new BufferTarget() });
  const videoSource = new CanvasSource(canvas, { codec: 'avc', bitrate });
  output.addVideoTrack(videoSource);

  let audioTrackSource = null;
  if(audioBuffer){
    audioTrackSource = new AudioBufferSource({ codec: 'aac', bitrate: 128000 });
    output.addAudioTrack(audioTrackSource);
  }

  await output.start();
  if(audioTrackSource && audioBuffer) await audioTrackSource.add(audioBuffer);

  for(let f = 0; f < totalFrames; f++){
    const t = f / fps;
    await renderFrameAtTime(t, true);
    await videoSource.add(t, 1 / fps);
    if(f % 15 === 0) status.textContent = `Rendering & Compressing: ${Math.round((f/totalFrames)*100)}%`;
  }

  await output.finalize();
  const blob = new Blob([output.target.buffer], { type: 'video/mp4' });
  const mb = (blob.size / (1024 * 1024)).toFixed(1);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `END_JUNE_V${activeVar+1}_${aspect.replace(':','x')}.mp4`;
  a.click();
  status.textContent = `Done! Downloaded (${mb} MB)`;
};
</script>
</body>
</html>
