<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>END JUNE v5.0 — Frame-Locked Lip-Sync Studio</title>
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#dc2626" />
<style>
  :root { --bg:#09090b; --card:#141418; --border:#27272a; --red:#dc2626; --text:#f4f4f5; --muted:#a1a1aa; }
  * { box-sizing:border-box; font-family:system-ui,-apple-system,sans-serif; }
  body { margin:0; background:var(--bg); color:var(--text); padding:12px; }
  header { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); padding-bottom:8px; margin-bottom:12px; max-width:1180px; margin-inline:auto; }
  h1 { margin:0; font-size:1.25rem; letter-spacing:2px; font-weight:900; }
  h1 span { color:var(--red); }
  .grid { display:grid; grid-template-columns:1fr; gap:12px; max-width:1180px; margin:auto; }
  @media(min-width:880px){ .grid { grid-template-columns:430px 1fr; } }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; }
  .label { font-size:0.7rem; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:5px; display:block; letter-spacing:0.5px; }
  button, select, input[type="file"], input[type="text"] { width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:#1f1f26; color:var(--text); font-weight:600; font-size:0.8rem; cursor:pointer; }
  input[type="text"] { cursor:text; }
  button.primary { background:var(--red); border-color:var(--red); color:#fff; }
  button.primary:disabled { opacity:0.5; cursor:not-allowed; }
  .row { display:flex; gap:6px; margin-bottom:8px; }
  .row > * { flex:1; }
  .pill-group { display:flex; gap:6px; margin-bottom:10px; }
  .pill { padding:7px; text-align:center; border:1px solid var(--border); border-radius:8px; cursor:pointer; font-size:0.78rem; font-weight:700; }
  .pill.active { background:var(--red); border-color:var(--red); }
  canvas { width:100%; max-height:480px; background:#000; border-radius:10px; display:block; margin:auto; object-fit:contain; }
  .clip-list { max-height:270px; overflow-y:auto; display:flex; flex-direction:column; gap:7px; margin-top:6px; }
  .clip-item { background:#1c1c22; padding:8px; border-radius:8px; border:1px solid var(--border); font-size:0.75rem; }
  .clip-item select { padding:4px; font-size:0.72rem; margin-top:4px; }
  .sync-box { margin-top:6px; background:#111115; padding:6px 8px; border-radius:6px; border:1px solid #27272a; }
  .sync-row { display:flex; align-items:center; gap:6px; }
  .sync-row input[type="range"] { flex:1; accent-color:var(--red); cursor:pointer; }
  .nudge-btn { padding:3px 7px; font-size:0.7rem; width:auto; background:#27272a; }
  .var-grid { display:grid; grid-template-columns:repeat(9, 1fr); gap:4px; margin:8px 0; }
  .var-btn { padding:7px 0; font-size:0.78rem; text-align:center; border-radius:6px; background:#1f1f26; border:1px solid var(--border); cursor:pointer; }
  .var-btn.active { background:var(--red); border-color:var(--red); font-weight:800; }
  #camModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:50; padding:16px; flex-direction:column; justify-content:center; align-items:center; }
  #camPreview { width:100%; max-width:420px; border-radius:12px; background:#000; }
  .status { font-size:0.75rem; color:#4ade80; margin-top:4px; min-height:16px; }
  .prog-bar { width:100%; height:6px; background:#27272a; border-radius:4px; overflow:hidden; margin-top:6px; display:none; }
  .prog-fill { height:100%; width:0%; background:var(--red); transition:width 0.1s; }
</style>
</head>
<body>

<div class="grid">

    </div>
    <div class="row" style="margin-top:10px;margin-bottom:0;">

</div>

<!-- CAMERA TAKE MODAL -->
<div id="camModal">
  <video id="camPreview" autoplay muted playsinline></video>
  <div class="row" style="max-width:420px;width:100%;margin-top:12px;">
    <button class="primary" id="recToggleBtn">● Start Synced Take</button>
    <button id="closeCamBtn">Close</button>
  </div>
</div>

<script type="module">
import { Output, Mp4OutputFormat, BufferTarget, CanvasSource, AudioBufferSource } from 'https://cdn.jsdelivr.net/npm/mediabunny@1.25.0/+esm';

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(reg => reg.update()).catch(()=>{});
}

let aspect = '9:16';
let audioBuffer = null;
let masterOnsets = null;
let audioCtx = null;
let audioSourceNode = null;
let beatTimes = [];
let clips = [];
let variations = [];
let varDescriptions = [];
let activeVar = 0;
let isPlaying = false;
let playStartTime = 0;
let rafId = null;

const GRADES = [
  { id: 0, name: 'Color Isolation (RED Pop)' },
  { id: 1, name: 'Dark / Moody Cinematic' },
  { id: 2, name: 'High Contrast B&W' },
  { id: 3, name: 'Neon Vibrant' },
  { id: 4, name: 'Crimson RED Wash' },
  { id: 5, name: 'Clean Natural' }
];

const FX_LIST = [
  '1. Zoom Punch',
  '2. Beat Flash',
  '3. RGB Glitch',
  '4. Beat Shake',
  '5. Whip Spin',
  '6. VHS Retro'
];

const canvas = document.getElementById('stage');
const hudCanvas = document.getElementById('hud');
const hudCtx = hudCanvas.getContext('2d');
const gl = canvas.getContext('webgl2', { preserveDrawingBuffer: true, powerPreference: 'high-performance' });

const vs = `#version 300 es
in vec2 a_pos; out vec2 v_uv;
void main(){ v_uv = a_pos * 0.5 + 0.5; v_uv.y = 1.0 - v_uv.y; gl_Position = vec4(a_pos, 0.0, 1.0); }`;

const fs = `#version 300 es
precision mediump float;
in vec2 v_uv; out vec4 outColor;
uniform sampler2D u_tex;
uniform int u_grade;
uniform int u_fx;
uniform int u_trans;
uniform float u_beatPulse;
uniform float u_time;
uniform vec2 u_scale;

void main(){
  vec2 uv = (v_uv - 0.5) * u_scale + 0.5;

  float tProg = clamp((u_beatPulse - 0.55) / 0.45, 0.0, 1.0);
  if(u_trans == 1 && tProg > 0.0) {
    uv.x = fract(uv.x + tProg * 0.45);
  } else if(u_trans == 2 && tProg > 0.0) {
    uv = (uv - 0.5) * (1.0 - tProg * 0.35) + 0.5;
  } else if(u_trans == 4 && tProg > 0.0) {
    float band = floor(uv.y * 14.0);
    uv.x += sin(band * 12.0 + u_time * 40.0) * 0.08 * tProg;
  }

  if(u_fx == 0) {
    uv = (uv - 0.5) * (1.0 - u_beatPulse * 0.09) + 0.5;
  } else if(u_fx == 3) {
    uv.x += sin(u_beatPulse * 35.0) * 0.018 * u_beatPulse;
    uv.y += cos(u_beatPulse * 28.0) * 0.012 * u_beatPulse;
  } else if(u_fx == 4) {
    float ang = sin(u_beatPulse * 3.14159) * 0.07;
    vec2 d = uv - 0.5;
    uv = vec2(d.x * cos(ang) - d.y * sin(ang), d.x * sin(ang) + d.y * cos(ang)) + 0.5;
  }

  vec3 col;
  if((u_fx == 2 && u_beatPulse > 0.1) || u_fx == 5) {
    float shift = (u_fx == 2) ? (0.022 * u_beatPulse) : 0.005;
    col.r = texture(u_tex, clamp(uv + vec2(shift, 0.0), 0.001, 0.999)).r;
    col.g = texture(u_tex, clamp(uv, 0.001, 0.999)).g;
    col.b = texture(u_tex, clamp(uv - vec2(shift, 0.0), 0.001, 0.999)).b;
  } else {
    col = texture(u_tex, clamp(uv, 0.001, 0.999)).rgb;
  }

  if(u_fx == 5) {
    float scan = sin(v_uv.y * 420.0) * 0.06;
    col -= scan;
  }

  float lum = dot(col, vec3(0.299, 0.587, 0.114));

  if(u_grade == 0) {
    float redness = col.r - max(col.g, col.b);
    float mask = smoothstep(0.07, 0.24, redness);
    vec3 bw = vec3(pow(lum, 1.15));
    col = mix(bw, col * vec3(1.3, 0.88, 0.88), mask);
  } else if(u_grade == 1) {
    col = pow(col, vec3(1.25)) * vec3(0.84, 0.92, 1.06);
    col = mix(vec3(lum), col, 0.85);
  } else if(u_grade == 2) {
    col = vec3(clamp((lum - 0.5) * 1.7 + 0.5, 0.0, 1.0));
  } else if(u_grade == 3) {
    col = mix(vec3(lum), col, 1.6);
    col = pow(col, vec3(0.92)) * vec3(1.06, 0.95, 1.16);
  } else if(u_grade == 4) {
    col = vec3(lum * 1.38, lum * 0.2, lum * 0.2);
  }

  if(u_fx == 1) { col += vec3(u_beatPulse * 0.5); }
  if(u_trans == 3 && tProg > 0.0) { col += vec3(tProg * 0.85); }
  if(u_trans == 5 && tProg > 0.0) { col *= (1.0 - tProg * 0.65); }

  float dist = distance(v_uv, vec2(0.5));
  col *= smoothstep(0.95, 0.35 - u_beatPulse * 0.05, dist);

  outColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

function createShader(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, createShader(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, createShader(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const posLoc = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(posLoc);
gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);

document.querySelectorAll('#aspectToggle .pill').forEach(p => {
  p.onclick = () => {
    document.querySelectorAll('#aspectToggle .pill').forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    aspect = p.dataset.aspect;
    updateCanvasSize();
  };
});

function updateCanvasSize(){
  const h = parseInt(document.getElementById('resSelect').value);
  const w = (aspect === '9:16') ? Math.round(h * 9 / 16) : Math.round(h * 16 / 9);
  canvas.width = hudCanvas.width = w;
  canvas.height = hudCanvas.height = h;
  gl.viewport(0, 0, w, h);
}
document.getElementById('resSelect').onchange = updateCanvasSize;

// SPECTRAL FLUX ONSET ENVELOPE (50Hz) FOR ACCURATE BEAT/VOCAL TRANSIENT SYNC
function computeOnsetEnvelope(buffer){
  const data = buffer.getChannelData(0);
  const sr = buffer.sampleRate;
  const win = Math.floor(sr * 0.02); // 20ms frames
  const count = Math.floor(data.length / win);
  const rms = new Float32Array(count);
  for(let i = 0; i < count; i++){
    let sum = 0;
    const base = i * win;
    for(let j = 0; j < win; j++) sum += data[base + j] * data[base + j];
    rms[i] = Math.sqrt(sum / win);
  }
  // Positive half-wave rectified derivative (captures sharp drum/vocal attacks, ignores room echo)
  const onset = new Float32Array(count);
  for(let i = 1; i < count; i++){
    onset[i] = Math.max(0, rms[i] - rms[i - 1]);
  }
  return onset;
}

// BIDIRECTIONAL ONSET CORRELATION (-15s to +15s)
async function detectVideoSyncOffset(blob){
  if(!masterOnsets || !audioCtx) return { offset: 0, confidence: 0 };
  try {
    const arr = await blob.arrayBuffer();
    const vidAudio = await audioCtx.decodeAudioData(arr);
    const vidOnsets = computeOnsetEnvelope(vidAudio);
    if(vidOnsets.length < 30) return { offset: 0, confidence: 0 };

    // lag in 20ms steps: videoTime = songTime + offset
    // Search -15s (-750 steps) to +15s (+750 steps)
    let bestLag = 0;
    let bestScore = 0;
    const maxCheck = Math.min(vidOnsets.length, 2000); // First 40s

    for(let lag = -750; lag <= 750; lag++){
      let dot = 0, normA = 0, normB = 0, overlap = 0;
      for(let songIdx = 0; songIdx < masterOnsets.length; songIdx++){
        const vidIdx = songIdx + lag;
        if(vidIdx >= 0 && vidIdx < maxCheck){
          const a = masterOnsets[songIdx];
          const b = vidOnsets[vidIdx];
          dot += a * b;
          normA += a * a;
          normB += b * b;
          overlap++;
        }
      }
      if(overlap > 75 && normA > 0 && normB > 0){
        const score = dot / Math.sqrt(normA * normB);
        if(score > bestScore){
          bestScore = score;
          bestLag = lag;
        }
      }
    }
    return { offset: +(bestLag * 0.02).toFixed(2), confidence: Math.round(bestScore * 100) };
  } catch(e) {
    return { offset: 0, confidence: 0 };
  }
}

document.getElementById('audioInput').onchange = async (e) => {
  const file = e.target.files[0];
  if(!file) return;
  document.getElementById('beatStatus').textContent = 'Analyzing master transients & beats...';
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const arr = await file.arrayBuffer();
  audioBuffer = await audioCtx.decodeAudioData(arr);
  masterOnsets = computeOnsetEnvelope(audioBuffer);
  beatTimes = detectBeats(audioBuffer);
  document.getElementById('beatStatus').textContent = `Master Ready: ${audioBuffer.duration.toFixed(1)}s | ${beatTimes.length} Sync Cuts`;

  for(const c of clips){
    if(c.type === 'perf' && c.rawBlob){
      const res = await detectVideoSyncOffset(c.rawBlob);
      c.syncOffset = res.offset;
      c.syncConf = res.confidence;
    }
  }
  renderClipList();
  if(clips.length) generate9Variations();
};

function detectBeats(buffer){
  const data = buffer.getChannelData(0);
  const sr = buffer.sampleRate;
  const step = Math.floor(sr * 0.05);
  const energies = [];
  for(let i = 0; i < data.length; i += step){
    let sum = 0;
    for(let j = 0; j < step && i + j < data.length; j++) sum += data[i+j] * data[i+j];
    energies.push(Math.sqrt(sum / step));
  }
  const cuts = [0];
  let lastCut = 0;
  for(let i = 2; i < energies.length - 2; i++){
    const t = (i * step) / sr;
    const localAvg = (energies[i-2] + energies[i-1] + energies[i+1] + energies[i+2]) / 4;
    if(energies[i] > localAvg * 1.28 && energies[i] > 0.065 && (t - lastCut) >= 0.48){
      cuts.push(t);
      lastCut = t;
    }
  }
  return cuts;
}

function extractHighlightWindows(duration){
  if(duration <= 4) return [0];
  const windows = [];
  const count = Math.min(16, Math.max(4, Math.floor(duration / 2.5)));
  for(let i = 0; i < count; i++){
    windows.push((duration * 0.9) * (i / count));
  }
  return windows;
}

document.getElementById('videoInput').onchange = async (e) => {
  for(const file of e.target.files){
    await addVideoClip(file, file.name, false);
  }
  if(beatTimes.length) generate9Variations();
};

async function addVideoClip(blob, name, fromInAppCam = false){
  const url = URL.createObjectURL(blob);
  const v = document.createElement('video');
  v.src = url; v.muted = true; v.playsInline = true; v.preload = 'auto';
  await new Promise(r => v.onloadedmetadata = r);
  const dur = v.duration || 4;
  const defaultType = (clips.length === 0 || fromInAppCam) ? 'perf' : (clips.length % 2 === 1 ? 'broll' : 'perf');

  let syncOffset = 0;
  let syncConf = fromInAppCam ? 100 : 0;
  if(defaultType === 'perf' && !fromInAppCam && masterOnsets){
    document.getElementById('beatStatus').textContent = `Scanning audio sync for ${name.slice(0,14)}...`;
    const res = await detectVideoSyncOffset(blob);
    syncOffset = res.offset;
    syncConf = res.confidence;
    document.getElementById('beatStatus').textContent = `Master Ready: ${audioBuffer.duration.toFixed(1)}s | ${beatTimes.length} Sync Cuts`;
  }

  clips.push({
    id: Date.now() + Math.random(),
    name,
    rawBlob: blob,
    type: defaultType,
    grade: 0,
    fx: 0,
    videoEl: v,
    duration: dur,
    windows: extractHighlightWindows(dur),
    syncOffset,
    syncConf
  });
  renderClipList();
}

function updateClipOffset(idx, newVal){
  const c = clips[idx];
  c.syncOffset = Math.max(-15, Math.min(15, +newVal.toFixed(2)));
  const label = document.getElementById(`syncVal_${idx}`);
  const slider = document.querySelector(`[data-sync="${idx}"]`);
  if(label) label.textContent = `${c.syncOffset >= 0 ? '+' : ''}${c.syncOffset.toFixed(2)}s`;
  if(slider) slider.value = c.syncOffset;
  if(isPlaying){
    const now = (audioBuffer && audioCtx) ? (audioCtx.currentTime - playStartTime) : (performance.now()/1000 - playStartTime);
    c.videoEl.currentTime = Math.max(0, now + c.syncOffset);
  } else if(variations.length) {
    renderFrameAtTime(0, true);
  }
}

function renderClipList(){
  const list = document.getElementById('clipList');
  list.innerHTML = '';
  clips.forEach((c, idx) => {
    const div = document.createElement('div');
    div.className = 'clip-item';
    const confColor = c.syncConf >= 35 ? '#4ade80' : '#fbbf24';
    const badge = c.type === 'perf'
      ? `<span style="color:${confColor};font-weight:700;">[SYNC ${c.syncOffset >= 0 ? '+' : ''}${c.syncOffset.toFixed(2)}s • ${c.syncConf}% match]</span>`
      : `<span style="color:#a1a1aa;font-weight:700;">[B-ROLL]</span>`;

    const syncHtml = c.type === 'perf' ? `
      <div class="sync-box">
        <div class="sync-row">
          <button class="nudge-btn" data-nudge="${idx}" data-delta="-0.1">-0.1s</button>
          <input type="range" min="-15" max="15" step="0.05" value="${c.syncOffset}" data-sync="${idx}" />
          <button class="nudge-btn" data-nudge="${idx}" data-delta="0.1">+0.1s</button>
          <span id="syncVal_${idx}" style="font-size:0.7rem;font-weight:700;min-width:44px;text-align:right;">${c.syncOffset >= 0 ? '+' : ''}${c.syncOffset.toFixed(2)}s</span>
        </div>
        <button class="nudge-btn" style="width:100%;margin-top:5px;background:#26262e;color:#4ade80;" data-mark="${idx}">
          🎯 Live Sync: Press ▶ Preview, then Tap Here at 0:00 of Video Action
        </button>
      </div>` : '';

    div.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <strong>${idx+1}. ${c.name.slice(0,13)} ${badge}</strong>
        <span style="color:var(--red);cursor:pointer;padding:0 4px;" data-del="${idx}">✕</span>
      </div>
      <div class="row" style="margin:4px 0 0 0;">
        <select data-type="${idx}">
          <option value="perf" ${c.type==='perf'?'selected':''}>Performance (Lip-Sync)</option>
          <option value="broll" ${c.type==='broll'?'selected':''}>B-Roll (Cutaways)</option>
        </select>
        <select data-grade="${idx}">
          ${GRADES.map(g => `<option value="${g.id}" ${c.grade===g.id?'selected':''}>${g.name}</option>`).join('')}
        </select>
        <select data-fx="${idx}">
          ${FX_LIST.map((f, i) => `<option value="${i}" ${c.fx===i?'selected':''}>${f}</option>`).join('')}
        </select>
      </div>
      ${syncHtml}`;
    list.appendChild(div);
  });

  list.querySelectorAll('[data-del]').forEach(el => el.onclick = () => { clips.splice(el.dataset.del, 1); renderClipList(); });
  list.querySelectorAll('[data-type]').forEach(el => el.onchange = async () => {
    const c = clips[el.dataset.type];
    c.type = el.value;
    if(c.type === 'perf' && c.rawBlob && masterOnsets){
      const res = await detectVideoSyncOffset(c.rawBlob);
      c.syncOffset = res.offset;
      c.syncConf = res.confidence;
    }
    renderClipList();
    if(variations.length) generate9Variations();
  });
  list.querySelectorAll('[data-grade]').forEach(el => el.onchange = () => clips[el.dataset.grade].grade = parseInt(el.value));
  list.querySelectorAll('[data-fx]').forEach(el => el.onchange = () => clips[el.dataset.fx].fx = parseInt(el.value));
  list.querySelectorAll('[data-sync]').forEach(el => el.oninput = () => updateClipOffset(el.dataset.sync, parseFloat(el.value)));
  list.querySelectorAll('[data-nudge]').forEach(el => el.onclick = () => {
    const idx = el.dataset.nudge;
    updateClipOffset(idx, clips[idx].syncOffset + parseFloat(el.dataset.delta));
  });
  list.querySelectorAll('[data-mark]').forEach(el => el.onclick = () => {
    const idx = el.dataset.mark;
    if(!isPlaying) return alert('Press "▶ Preview Sync" first, then tap this button right when the first vocal/beat hits!');
    const songNow = (audioBuffer && audioCtx) ? (audioCtx.currentTime - playStartTime) : (performance.now()/1000 - playStartTime);
    // Align current video frame to current song time
    const vidNow = clips[idx].videoEl.currentTime;
    updateClipOffset(idx, vidNow - songNow);
  });
}

document.getElementById('randomizeStylesBtn').onclick = () => {
  clips.forEach(c => {
    c.grade = Math.floor(Math.random() * GRADES.length);
    c.fx = Math.floor(Math.random() * FX_LIST.length);
  });
  renderClipList();
  if(variations.length) renderFrameAtTime(0, true);
};

const REMIX_MODES = [
  { name: 'V1: Balanced Multi-Cam + B-Roll', step: 1, perfBias: 0.65, overrideGrade: -1 },
  { name: 'V2: Fast Hype Cuts', step: 1, perfBias: 0.5, overrideGrade: -1 },
  { name: 'V3: Vocal Verse Hold + B-Roll Hits', step: 2, perfBias: 0.75, overrideGrade: -1 },
  { name: 'V4: Heavy B-Roll + Chorus Sync', step: 1, perfBias: 0.4, overrideGrade: -1 },
  { name: 'V5: Performance Spotlight', step: 2, perfBias: 0.85, overrideGrade: -1 },
  { name: 'V6: Sin City RED Pop Remix', step: 1, perfBias: 0.65, overrideGrade: 0 },
  { name: 'V7: High-Contrast Noir Cut', step: 2, perfBias: 0.6, overrideGrade: 2 },
  { name: 'V8: Neon Club Remix', step: 1, perfBias: 0.55, overrideGrade: 3 },
  { name: 'V9: Slow-Burn Drama Cut', step: 3, perfBias: 0.7, overrideGrade: 1 }
];

function generate9Variations(){
  if(!clips.length) return alert('Add at least 1 video clip first.');
  const baseCuts = beatTimes.length ? beatTimes : Array.from({length: 30}, (_, i) => i * 0.75);
  const perf = clips.map((c, i) => ({c, i})).filter(x => x.c.type === 'perf');
  const broll = clips.map((c, i) => ({c, i})).filter(x => x.c.type === 'broll');
  const transMode = document.getElementById('globalTrans').value;

  variations = REMIX_MODES.map((mode, vIdx) => {
    const activeCuts = baseCuts.filter((_, idx) => idx % mode.step === 0);
    let lastClip = -1;
    let lastWin = -1;

    return activeCuts.map((t) => {
      let pool;
      if(perf.length && broll.length){
        pool = (Math.random() < mode.perfBias) ? perf : broll;
      } else {
        pool = perf.length ? perf : broll;
      }

      let chosen = pool[Math.floor(Math.random() * pool.length)];
      if(pool.length > 1 && chosen.i === lastClip){
        const altIndex = (pool.indexOf(chosen) + 1 + Math.floor(Math.random() * (pool.length - 1))) % pool.length;
        chosen = pool[altIndex];
      }
      lastClip = chosen.i;

      let isLockedPerf = (chosen.c.type === 'perf');
      let brollStartOffset = 0;

      if(!isLockedPerf){
        const winList = chosen.c.windows;
        let winIdx = Math.floor(Math.random() * winList.length);
        if(winList.length > 1 && winIdx === lastWin) winIdx = (winIdx + 1) % winList.length;
        lastWin = winIdx;
        const jitter = Math.random() * Math.min(2.0, chosen.c.duration * 0.25);
        brollStartOffset = (winList[winIdx] + jitter) % Math.max(0.5, chosen.c.duration - 1.0);
      }

      const trans = (transMode === 'random') ? Math.floor(Math.random() * 6) : parseInt(transMode);
      const fx = (vIdx % 2 === 1) ? ((chosen.c.fx + vIdx) % FX_LIST.length) : chosen.c.fx;

      return {
        time: t,
        clipIndex: chosen.i,
        isLockedPerf,
        brollStartOffset,
        trans,
        grade: mode.overrideGrade !== -1 ? mode.overrideGrade : chosen.c.grade,
        fx
      };
    });
  });

  varDescriptions = REMIX_MODES.map((m, i) => `${m.name} (${variations[i].length} cuts)`);

  const grid = document.getElementById('varGrid');
  grid.innerHTML = '';
  for(let i = 0; i < 9; i++){
    const b = document.createElement('div');
    b.className = 'var-btn' + (i === activeVar ? ' active' : '');
    b.textContent = `V${i+1}`;
    b.onclick = () => {
      activeVar = i;
      document.querySelectorAll('.var-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      document.getElementById('varInfo').textContent = varDescriptions[i];
      renderFrameAtTime(0, true);
    };
    grid.appendChild(b);
  }
  document.getElementById('varInfo').textContent = varDescriptions[activeVar];
  renderFrameAtTime(0, true);
}
document.getElementById('shuffleBtn').onclick = generate9Variations;

function drawOverlayBadge(pulse){
  const title = document.getElementById('titleOverlay').value.trim();
  hudCtx.clearRect(0, 0, hudCanvas.width, hudCanvas.height);
  if(!title) return;
  const scale = 1 + pulse * 0.04;
  hudCtx.save();
  hudCtx.translate(hudCanvas.width / 2, hudCanvas.height * 0.88);
  hudCtx.scale(scale, scale);
  hudCtx.font = `900 ${Math.round(hudCanvas.width * 0.042)}px system-ui, sans-serif`;
  hudCtx.textAlign = 'center';
  hudCtx.fillStyle = 'rgba(0,0,0,0.55)';
  const w = hudCtx.measureText(title.toUpperCase()).width + 28;
  hudCtx.fillRect(-w/2, -24, w, 34);
  hudCtx.fillStyle = '#ffffff';
  hudCtx.fillText(title.toUpperCase(), 0, 0);
  hudCtx.restore();
}

async function renderFrameAtTime(t, seekExact = false){
  const tl = variations[activeVar];
  if(!tl || !tl.length || !clips.length) return;
  let segIdx = 0;
  for(let i = 0; i < tl.length; i++){ if(tl[i].time <= t) segIdx = i; else break; }
  const seg = tl[segIdx];
  const clip = clips[seg.clipIndex];
  const v = clip.videoEl;

  let targetTime;
  if(seg.isLockedPerf){
    targetTime = Math.max(0, t + clip.syncOffset);
    if(targetTime >= clip.duration - 0.05) targetTime = targetTime % Math.max(0.2, clip.duration - 0.1);
  } else {
    targetTime = (seg.brollStartOffset + (t - seg.time)) % Math.max(0.2, clip.duration - 0.1);
  }

  if(seekExact){
    if(Math.abs(v.currentTime - targetTime) > 0.015){
      v.currentTime = targetTime;
      await new Promise(r => {
        let done = false;
        const finish = () => { if(!done){ done = true; v.removeEventListener('seeked', finish); r(); } };
        v.addEventListener('seeked', finish);
        setTimeout(finish, 120);
      });
    }
  } else {
    // Tight 60ms drift lock during live preview
    if(Math.abs(v.currentTime - targetTime) > 0.06){
      v.currentTime = targetTime;
    }
  }

  if(v.readyState >= 2){
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, v);
  }

  const cAsp = canvas.width / canvas.height;
  const vAsp = (v.videoWidth || 720) / (v.videoHeight || 1280);
  let sx = 1, sy = 1;
  if(vAsp > cAsp) sx = cAsp / vAsp; else sy = vAsp / cAsp;

  const pulse = Math.max(0, 1 - (t - seg.time) * 3.5);
  gl.uniform1i(gl.getUniformLocation(prog, 'u_grade'), seg.grade !== undefined ? seg.grade : clip.grade);
  gl.uniform1i(gl.getUniformLocation(prog, 'u_fx'), seg.fx !== undefined ? seg.fx : clip.fx);
  gl.uniform1i(gl.getUniformLocation(prog, 'u_trans'), seg.trans);
  gl.uniform1f(gl.getUniformLocation(prog, 'u_beatPulse'), pulse);
  gl.uniform1f(gl.getUniformLocation(prog, 'u_time'), t);
  gl.uniform2f(gl.getUniformLocation(prog, 'u_scale'), sx, sy);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  drawOverlayBadge(pulse);
}

document.getElementById('playBtn').onclick = () => {
  if(!variations.length) generate9Variations();
  if(!variations.length) return;
  stopPlayback();
  isPlaying = true;
  if(audioBuffer && audioCtx){
    audioSourceNode = audioCtx.createBufferSource();
    audioSourceNode.buffer = audioBuffer;
    audioSourceNode.connect(audioCtx.destination);
    audioSourceNode.start();
    playStartTime = audioCtx.currentTime;
  } else {
    playStartTime = performance.now() / 1000;
  }
  clips.forEach(c => {
    c.videoEl.playbackRate = 1.0;
    c.videoEl.currentTime = c.type === 'perf' ? Math.max(0, c.syncOffset) : 0;
    c.videoEl.play().catch(()=>{});
  });
  const loop = () => {
    if(!isPlaying) return;
    const now = (audioBuffer && audioCtx) ? (audioCtx.currentTime - playStartTime) : (performance.now()/1000 - playStartTime);
    const maxDur = audioBuffer ? audioBuffer.duration : 20;
    if(now >= maxDur) return stopPlayback();
    renderFrameAtTime(now, false);
    rafId = requestAnimationFrame(loop);
  };
  loop();
};

function stopPlayback(){
  isPlaying = false;
  cancelAnimationFrame(rafId);
  if(audioSourceNode){ try{ audioSourceNode.stop(); }catch(e){} audioSourceNode = null; }
  clips.forEach(c => c.videoEl.pause());
}
document.getElementById('stopBtn').onclick = stopPlayback;

let camStream = null, mediaRec = null, recChunks = [];
document.getElementById('openCamBtn').onclick = async () => {
  document.getElementById('camModal').style.display = 'flex';
  camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
  document.getElementById('camPreview').srcObject = camStream;
};
document.getElementById('closeCamBtn').onclick = () => {
  document.getElementById('camModal').style.display = 'none';
  if(camStream) camStream.getTracks().forEach(t => t.stop());
};
document.getElementById('recToggleBtn').onclick = () => {
  const btn = document.getElementById('recToggleBtn');
  if(!mediaRec || mediaRec.state === 'inactive'){
    recChunks = [];
    mediaRec = new MediaRecorder(camStream);
    mediaRec.ondataavailable = e => { if(e.data.size) recChunks.push(e.data); };
    mediaRec.onstop = async () => {
      stopPlayback();
      const blob = new Blob(recChunks, { type: 'video/webm' });
      await addVideoClip(blob, `Take_${clips.length+1}.webm`, true);
      if(beatTimes.length) generate9Variations();
      document.getElementById('closeCamBtn').click();
    };
    mediaRec.start();
    if(audioBuffer && audioCtx){
      audioSourceNode = audioCtx.createBufferSource();
      audioSourceNode.buffer = audioBuffer;
      audioSourceNode.connect(audioCtx.destination);
      audioSourceNode.start();
    }
    btn.textContent = '■ Stop & Add Take';
  } else {
    mediaRec.stop();
    btn.textContent = '● Start Synced Take';
  }
};

document.getElementById('exportBtn').onclick = async () => {
  if(!variations.length) return alert('Generate variations first.');
  stopPlayback();
  const btn = document.getElementById('exportBtn');
  const status = document.getElementById('exportStatus');
  const progBar = document.getElementById('progBar');
  const progFill = document.getElementById('progFill');

  btn.disabled = true;
  progBar.style.display = 'block';
  progFill.style.width = '2%';

  try {
    const bitrate = parseInt(document.getElementById('compSelect').value);
    const fps = parseInt(document.getElementById('fpsSelect').value);
    const duration = audioBuffer ? audioBuffer.duration : 15;
    const totalFrames = Math.floor(duration * fps);

    const compCanvas = document.createElement('canvas');
    compCanvas.width = canvas.width;
    compCanvas.height = canvas.height;
    const compCtx = compCanvas.getContext('2d');

    status.textContent = 'Initializing hardware encoder...';
    await new Promise(r => setTimeout(r, 30));

    const output = new Output({ format: new Mp4OutputFormat(), target: new BufferTarget() });
    const videoSource = new CanvasSource(compCanvas, { codec: 'avc', bitrate });
    output.addVideoTrack(videoSource);

    let audioTrackSource = null;
    if(audioBuffer){
      audioTrackSource = new AudioBufferSource({ codec: 'aac', bitrate: 128000 });
      output.addAudioTrack(audioTrackSource);
    }

    await output.start();
    if(audioTrackSource && audioBuffer){
      status.textContent = 'Encoding AAC audio track...';
      await new Promise(r => setTimeout(r, 20));
      await audioTrackSource.add(audioBuffer);
    }

    for(let f = 0; f < totalFrames; f++){
      const t = f / fps;
      await renderFrameAtTime(t, true);
      compCtx.drawImage(canvas, 0, 0);
      compCtx.drawImage(hudCanvas, 0, 0);
      await videoSource.add(t, 1 / fps);

      if(f % 8 === 0){
        const pct = Math.round((f / totalFrames) * 100);
        progFill.style.width = `${pct}%`;
        status.textContent = `Rendering Frame ${f}/${totalFrames} (${pct}%)`;
        await new Promise(r => setTimeout(r, 0));
      }
    }

    status.textContent = 'Finalizing compressed MP4...';
    await output.finalize();
    progFill.style.width = '100%';

    const blob = new Blob([output.target.buffer], { type: 'video/mp4' });
    const mb = (blob.size / (1024 * 1024)).toFixed(1);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `END_JUNE_V${activeVar+1}_${aspect.replace(':','x')}.mp4`;
    a.click();
    status.textContent = `Done! Downloaded (${mb} MB)`;
  } catch (err) {
    status.textContent = `Export error: ${err.message}. Try 720p + 24 FPS.`;
  } finally {
    btn.disabled = false;
  }
};
